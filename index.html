<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>calton</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #000000;
  --muted: #555555;
  --line: #888888;
  --soft: #eeeeee;
  --long: #1a7a3e;
  --short: #b82525;
  --scale: 1.3;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: Arial, Helvetica, sans-serif;
  font-size: calc(14px * var(--scale));
}
.app {
  width: 100%;
  min-height: 100vh;
  padding: calc(28px * var(--scale)) calc(44px * var(--scale));
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: calc(12px * var(--scale));
  margin-bottom: calc(20px * var(--scale));
  border-bottom: 1px solid #cccccc;
}
.title {
  font-size: calc(16px * var(--scale));
  font-weight: normal;
}
#status {
  font-size: calc(13px * var(--scale));
  color: var(--muted);
}
.panes {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: calc(36px * var(--scale));
}
.pane {
  flex: 1;
  min-width: 0;
}
.sides {
  display: flex;
  gap: calc(8px * var(--scale));
  margin-bottom: calc(14px * var(--scale));
}
.sides button {
  flex: 1;
  padding: calc(8px * var(--scale)) calc(10px * var(--scale));
  font-family: Arial, Helvetica, sans-serif;
  font-size: calc(14px * var(--scale));
  border: 1px solid var(--line);
  border-radius: calc(3px * var(--scale));
  background: #f5f5f5;
  color: var(--fg);
  cursor: pointer;
}
.sides button.long-active {
  background: var(--long);
  border-color: var(--long);
  color: #ffffff;
}
.sides button.short-active {
  background: var(--short);
  border-color: var(--short);
  color: #ffffff;
}
.field {
  margin-bottom: calc(14px * var(--scale));
}
.sym-wrap {
  position: relative;
}
label {
  display: block;
  margin-bottom: calc(4px * var(--scale));
  font-size: calc(13px * var(--scale));
}
input, select {
  width: 100%;
  box-sizing: border-box;
  padding: calc(7px * var(--scale)) calc(9px * var(--scale));
  font-family: Arial, Helvetica, sans-serif;
  font-size: calc(14px * var(--scale));
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0;
}
#drop {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 20;
  max-height: calc(240px * var(--scale));
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--line);
  border-top: 0;
}
#drop.open {
  display: block;
}
.opt {
  display: flex;
  justify-content: space-between;
  gap: calc(12px * var(--scale));
  padding: calc(8px * var(--scale)) calc(9px * var(--scale));
  cursor: pointer;
  border-bottom: 1px solid var(--soft);
  font-size: calc(13px * var(--scale));
}
.opt:last-child {
  border-bottom: 0;
}
.opt:hover, .opt.sel {
  background: var(--soft);
}
.opt-sym {
  font-weight: bold;
}
.opt-name {
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pair {
  display: flex;
  gap: calc(12px * var(--scale));
}
.pair .field {
  flex: 1;
}
.qty-box {
  padding: calc(14px * var(--scale)) calc(16px * var(--scale));
  border: 1px solid var(--line);
  margin-bottom: calc(16px * var(--scale));
}
.qty-label {
  font-size: calc(13px * var(--scale));
  color: #444444;
}
.qty-num {
  margin-top: calc(4px * var(--scale));
  font-size: calc(32px * var(--scale));
}
#unit {
  font-size: calc(14px * var(--scale));
  color: #444444;
  margin-left: calc(6px * var(--scale));
}
table {
  width: 100%;
  border-collapse: collapse;
}
td {
  padding: calc(9px * var(--scale)) calc(4px * var(--scale));
  border-bottom: 1px solid #dddddd;
  font-size: calc(14px * var(--scale));
}
td:last-child {
  text-align: right;
}
@media (max-width: 720px) {
  .app {
    padding: calc(20px * var(--scale)) calc(24px * var(--scale));
  }
  .panes {
    flex-direction: column;
    gap: calc(24px * var(--scale));
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">calton</span>
    <span id="status"></span>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="sides">
        <button type="button" id="longBtn">Long</button>
        <button type="button" id="shortBtn">Short</button>
      </div>

      <div class="field">
        <label for="symbol">Symbol</label>
        <div class="sym-wrap">
          <input id="symbol" value="SPY" autocomplete="off" spellcheck="false">
          <div id="drop"></div>
        </div>
      </div>

      <div class="field">
        <label for="entryIn">Entry (blank = market)</label>
        <input id="entryIn" type="number" step="any" placeholder="market">
      </div>

      <div class="pair">
        <div class="field">
          <label for="equity">Account ($)</label>
          <input id="equity" type="number" step="any" value="10000">
        </div>
        <div class="field">
          <label for="risk">Risk (%)</label>
          <input id="risk" type="number" step="any" value="1">
        </div>
      </div>

      <div class="pair">
        <div class="field">
          <label for="rr">Target (R)</label>
          <input id="rr" type="number" step="any" value="2">
        </div>
        <div class="field">
          <label for="tf">Timeframe</label>
          <select id="tf">
            <option value="1m">1m</option>
            <option value="5m">5m</option>
            <option value="15m">15m</option>
            <option value="30m">30m</option>
            <option value="1h">1h</option>
            <option value="4h">4h</option>
            <option value="1d" selected>1d</option>
            <option value="1w">1w</option>
          </select>
        </div>
      </div>
    </div>

    <div class="pane">
      <div class="qty-box">
        <div class="qty-label">Size (<span id="outSym">SPY</span>)</div>
        <div class="qty-num"><span id="qty">-</span><span id="unit"></span></div>
      </div>

      <table>
        <tr><td>Entry</td><td id="entry">-</td></tr>
        <tr><td>Stop</td><td id="stop">-</td></tr>
        <tr><td>Target</td><td id="target">-</td></tr>
        <tr><td>Max loss</td><td id="loss">-</td></tr>
        <tr><td>Max gain</td><td id="gain">-</td></tr>
        <tr><td>Notional</td><td id="notional">-</td></tr>
      </table>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STORAGE_KEY = "calton.state.v1";

let dir = "LONG", timer, searchTimer, abortCtrl, searchCtrl, filtered = [], selIdx = -1;

function savePrefs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      dir,
      symbol: $("symbol").value.trim().toUpperCase(),
      equity: $("equity").value,
      risk: $("risk").value,
      rr: $("rr").value,
      tf: $("tf").value
    }));
  } catch (_) {}
}

function loadPrefs() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.symbol) $("symbol").value = s.symbol;
    if (s.equity) $("equity").value = s.equity;
    if (s.risk) $("risk").value = s.risk;
    if (s.rr) $("rr").value = s.rr;
    if (s.tf && $("tf").querySelector(`option[value="${s.tf}"]`)) $("tf").value = s.tf;
    if (s.dir === "LONG" || s.dir === "SHORT") dir = s.dir;
  } catch (_) {}
}

function closeDrop() {
  $("drop").className = "";
  $("drop").replaceChildren();
  filtered = [];
  selIdx = -1;
}

function pickSymbol(sym) {
  $("symbol").value = sym;
  closeDrop();
  savePrefs();
  calc();
}

function highlight() {
  [...$("drop").children].forEach((el, i) => {
    el.classList.toggle("sel", i === selIdx);
    if (i === selIdx) el.scrollIntoView({ block: "nearest" });
  });
}

function paintOptions(rows) {
  filtered = rows.map(r => [r.symbol, r.name]);
  selIdx = -1;
  if (!filtered.length) return closeDrop();

  const drop = $("drop");
  const frag = document.createDocumentFragment();
  filtered.forEach(([s, n], i) => {
    const row = document.createElement("div");
    row.className = "opt";

    const symSpan = document.createElement("span");
    symSpan.className = "opt-sym";
    symSpan.textContent = s;

    const nameSpan = document.createElement("span");
    nameSpan.className = "opt-name";
    nameSpan.textContent = n;

    row.append(symSpan, nameSpan);
    row.onpointerdown = e => {
      e.preventDefault();
      pickSymbol(s);
    };
    row.onmouseenter = () => {
      selIdx = i;
      highlight();
    };
    frag.appendChild(row);
  });
  drop.replaceChildren(frag);
  drop.className = "open";
}

async function renderDrop(q) {
  searchCtrl?.abort();
  const clean = q.trim().toUpperCase();
  if (!clean) return closeDrop();

  searchCtrl = new AbortController();
  try {
    const res = await fetch(`/api/tickers?q=${encodeURIComponent(clean)}&limit=50`, { signal: searchCtrl.signal });
    if (!res.ok) return closeDrop();
    const rows = await res.json();
    paintOptions(rows);
  } catch (e) {
    if (e.name !== "AbortError") closeDrop();
  }
}

function applyDirStyle() {
  $("longBtn").className = dir === "LONG" ? "long-active" : "";
  $("shortBtn").className = dir === "SHORT" ? "short-active" : "";
}

function setDir(next) {
  dir = next;
  applyDirStyle();
  savePrefs();
  calc();
}

$("longBtn").onclick = () => setDir("LONG");
$("shortBtn").onclick = () => setDir("SHORT");

function fail(msg) {
  $("status").textContent = msg;
  ["qty", "unit", "entry", "stop", "target", "loss", "gain", "notional"].forEach(id => {
    $(id).textContent = "-";
  });
}

async function calc() {
  abortCtrl?.abort();
  abortCtrl = new AbortController();

  const symbol = $("symbol").value.trim().toUpperCase();
  const equity = Number($("equity").value);
  const risk_pct = Number($("risk").value);
  const rr = Number($("rr").value);
  const rawEntry = $("entryIn").value.trim();
  const entry_price = rawEntry === "" ? null : Number(rawEntry);

  if (!symbol || !(equity > 0) || !(risk_pct > 0) || !(rr > 0) || (entry_price !== null && !(entry_price > 0))) {
    return fail("bad input");
  }

  $("status").textContent = "calc...";

  try {
    const res = await fetch("/api/calc", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        symbol,
        direction: dir,
        equity,
        risk_pct,
        rr,
        timeframe: $("tf").value,
        entry_price
      }),
      signal: abortCtrl.signal
    });
    const d = await res.json();
    if (!res.ok) return fail(d.detail || "err");

    $("outSym").textContent = d.symbol;
    $("qty").textContent = d.quantity;
    $("unit").textContent = d.unit;
    $("entry").textContent = "$" + d.entry;
    $("stop").textContent = "$" + d.stop + " (" + d.stop_pct + "%)";
    $("target").textContent = "$" + d.target;
    $("loss").textContent = "-$" + d.risk_at_size;
    $("gain").textContent = "+$" + d.reward_at_target;
    $("notional").textContent = "$" + d.notional;
    $("status").textContent = new Date(d.priced_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (err) {
    if (err.name !== "AbortError") fail("offline");
  }
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(calc, 150);
}

$("symbol").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => renderDrop($("symbol").value), 30);
  savePrefs();
  schedule();
});

$("symbol").addEventListener("focus", () => {
  renderDrop($("symbol").value);
});

$("symbol").addEventListener("keydown", e => {
  if (!$("drop").classList.contains("open")) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    selIdx = (selIdx + 1) % filtered.length;
    highlight();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    selIdx = (selIdx - 1 + filtered.length) % filtered.length;
    highlight();
  } else if (e.key === "Enter" && selIdx >= 0) {
    e.preventDefault();
    pickSymbol(filtered[selIdx][0]);
  } else if (e.key === "Escape") {
    closeDrop();
  }
});

document.addEventListener("pointerdown", e => {
  if (!e.target.closest(".sym-wrap")) closeDrop();
});

["entryIn", "equity", "risk", "rr", "tf"].forEach(id => {
  $(id).addEventListener("input", () => {
    savePrefs();
    schedule();
  });
  $(id).addEventListener("change", () => {
    savePrefs();
    calc();
  });
});

loadPrefs();
applyDirStyle();
calc();
</script>
</body>
</html>
