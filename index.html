<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position Engine</title>
<style>
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --line: #d1d5db;
  --text: #111827;
  --muted: #6b7280;
  --long: #15803d;
  --short: #b91c1c;
  --accent: #1d4ed8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
main {
  max-width: 860px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 20px;
}
h1 {
  margin: 0;
  font-size: 18px;
}
.sub {
  font-size: 12px;
  color: var(--muted);
}
.layout {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 24px;
}
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
}
.direction {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.direction button {
  padding: 8px 12px;
  border: 1px solid var(--line);
  background: #f9fafb;
  color: var(--text);
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
}
.direction[data-dir="LONG"] button[data-side="LONG"][aria-pressed="true"] {
  background: var(--long);
  border-color: var(--long);
  color: #fff;
}
.direction[data-dir="SHORT"] button[data-side="SHORT"][aria-pressed="true"] {
  background: var(--short);
  border-color: var(--short);
  color: #fff;
}
.field {
  margin-bottom: 14px;
}
label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-bottom: 4px;
}
.control {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  padding: 0 10px;
  height: 36px;
}
.control:focus-within {
  border-color: var(--accent);
}
input, select {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
}
.prefix, .suffix {
  color: var(--muted);
  font-weight: 600;
  font-size: 13px;
}
.prefix { margin-right: 4px; }
.suffix { margin-left: 4px; }
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.symbol-wrap { position: relative; }
#symbol { font-weight: 600; text-transform: uppercase; }
#suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 20;
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  max-height: 220px;
  overflow-y: auto;
}
#suggestions[hidden] { display: none; }
#suggestions li {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  cursor: pointer;
}
#suggestions li:hover, #suggestions li[aria-selected="true"] {
  background: #eff6ff;
}
.s-name {
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
  background: #fafafa;
}
.result-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
#result-symbol {
  font-weight: 700;
  font-size: 15px;
}
#status {
  font-size: 12px;
  color: var(--muted);
}
#status.error {
  color: var(--short);
  font-weight: 600;
}
.big {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px;
  text-align: center;
  margin-bottom: 14px;
}
.big-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
}
#quantity {
  font-size: 32px;
  font-weight: 700;
  margin-top: 2px;
  display: inline-block;
}
#unit {
  font-size: 13px;
  color: var(--muted);
  margin-left: 6px;
}
.rows {
  margin: 0;
}
.rows div {
  display: flex;
  justify-content: space-between;
  padding: 7px 4px;
  border-bottom: 1px solid #e5e7eb;
}
.rows div:last-child { border-bottom: 0; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Position Engine</h1>
    <span class="sub">Instant risk-first sizing</span>
  </header>
  <div class="layout">
    <section class="inputs" aria-label="Trade inputs">
      <div class="direction" id="direction" data-dir="LONG" role="group" aria-label="Direction">
        <button type="button" data-side="LONG" aria-pressed="true">Long</button>
        <button type="button" data-side="SHORT" aria-pressed="false">Short</button>
      </div>
      <div class="field">
        <label for="symbol">Asset or chart URL</label>
        <div class="symbol-wrap">
          <div class="control">
            <input id="symbol" value="SPY" autocomplete="off" autocapitalize="characters" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
          </div>
          <ul id="suggestions" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="field">
        <label for="custom-entry">Entry price (optional)</label>
        <div class="control">
          <span class="prefix">$</span>
          <input id="custom-entry" type="number" min=".00000001" step="any" placeholder="Latest quote">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="equity">Equity</label>
          <div class="control"><span class="prefix">$</span><input id="equity" type="number" min=".01" step="any" value="10000"></div>
        </div>
        <div class="field">
          <label for="risk">Risk</label>
          <div class="control"><input id="risk" type="number" min=".01" max="100" step="any" value="1"><span class="suffix">%</span></div>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="rr">Target</label>
          <div class="control"><input id="rr" type="number" min=".01" max="100" step="any" value="2"><span class="suffix">R</span></div>
        </div>
        <div class="field">
          <label for="timeframe">Timeframe</label>
          <div class="control">
            <select id="timeframe">
              <option value="1m">1m</option>
              <option value="5m">5m</option>
              <option value="15m">15m</option>
              <option value="30m">30m</option>
              <option value="1h">1h</option>
              <option value="4h">4h</option>
              <option value="1d" selected>1D</option>
              <option value="1w">1W</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <section class="result" id="result" aria-label="Position calculation">
      <div class="result-head">
        <span id="result-symbol">SPY</span>
        <span id="status" aria-live="polite">Calculating…</span>
      </div>
      <div class="big">
        <div class="big-label">Position Size</div>
        <span id="quantity">—</span><span id="unit"></span>
      </div>
      <dl class="rows">
        <div><dt>Entry</dt><dd id="entry">—</dd></div>
        <div><dt>Stop</dt><dd id="stop">—</dd></div>
        <div><dt>Target</dt><dd id="target">—</dd></div>
        <div><dt>Risk</dt><dd id="risk-value">—</dd></div>
        <div><dt>Reward</dt><dd id="reward">—</dd></div>
        <div><dt>Notional</dt><dd id="notional">—</dd></div>
      </dl>
    </section>
  </div>
</main>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const symbol = $("symbol"), customEntry = $("custom-entry"), suggestions = $("suggestions"), status = $("status");
let direction = "LONG", searchTimer, calcTimer, searchAbort, calcAbort, searchSeq = 0, calcSeq = 0;
let matches = [], active = -1;

const EXCHANGES = new Set(["NASDAQ", "NYSE", "AMEX", "ARCA", "BATS", "CBOE", "OTC", "CME", "BINANCE", "BYBIT", "OKX", "TVC"]);
const TRADFI_TICKERS = new Set(["SPY", "QQQ", "DIA", "IWM", "AAPL", "MSFT", "NVDA", "AMD", "AMZN", "META", "TSLA"]);
const INDEX_ALIASES = {
  SPX: "^GSPC", SPX500: "^GSPC", US500: "^GSPC",
  NAS100: "^NDX", US100: "^NDX",
  US30: "^DJI", DJI: "^DJI",
  VIX: "^VIX",
  GOLD: "GC=F", XAUUSD: "GC=F",
  SILVER: "SI=F", XAGUSD: "SI=F",
  USOIL: "CL=F", WTI: "CL=F",
};
const TV_INTERVALS = { "1": "1m", "5": "5m", "15": "15m", "30": "30m", "60": "1h", "240": "4h", "D": "1d", "1D": "1d", "W": "1w", "1W": "1w" };

function looksLikeLink(text) {
  const t = String(text).trim();
  return /^https?:\/\//i.test(t) || /^www\./i.test(t) || /^[a-z0-9-]+(\.[a-z0-9-]+)+[/?]/i.test(t);
}

function stripExchange(s) {
  if (!s.includes(":")) return s;
  const [left, right] = s.split(":");
  return EXCHANGES.has(left) ? right : (EXCHANGES.has(right) ? left : right);
}

function normalizeSymbol(input) {
  let s = stripExchange(String(input).trim().toUpperCase().replace(/\s+/g, ""));
  if (!s) return "";
  s = s.replace(/[-_.]PERP$/, "").replace(/\.P$/, "");
  if (INDEX_ALIASES[s]) return INDEX_ALIASES[s];
  let m = s.match(/^([A-Z0-9]+)[12]!$/);
  if (m && ["ES", "NQ", "RTY", "YM", "MES", "MNQ", "M2K", "MYM", "CL", "MCL", "GC", "MGC", "SI"].includes(m[1])) {
    return `${m[1]}=F`;
  }
  m = s.match(/^([A-Z]{3})([A-Z]{3})$/);
  if (m && !TRADFI_TICKERS.has(s) && !s.endsWith("USD") && !s.endsWith("USDT") && !s.endsWith("USDC")) {
    return `${m[1]}${m[2]}=X`;
  }
  m = s.match(/^([A-Z0-9]{2,10})[-/]?(USDT|USDC|USD)$/);
  if (m) {
    const base = m[1];
    if (INDEX_ALIASES[base]) return INDEX_ALIASES[base];
    if (TRADFI_TICKERS.has(base)) return base;
    return `${base}-USD`;
  }
  return s;
}

function parseLink(text) {
  const t = String(text).trim();
  let url;
  try {
    url = new URL(/^https?:\/\//i.test(t) ? t : `https://${t}`);
  } catch {
    return null;
  }
  const interval = url.searchParams.get("interval") || url.searchParams.get("resolution");
  const timeframe = interval ? (TV_INTERVALS[interval.toUpperCase()] ?? null) : null;
  let raw = "";
  for (const [k, v] of url.searchParams.entries()) {
    if (["symbol", "ticker", "pair", "t", "s", "p"].includes(k.toLowerCase()) && v) {
      raw = v;
      break;
    }
  }
  if (!raw) {
    const parts = url.pathname.split("/").filter(Boolean);
    if (parts.length > 0 && (parts[0] === "trade" || parts[0] === "pro")) {
      const tail = parts.slice(1).filter(p => !["spot", "usdt", "usdc", "linear", "perpetual"].includes(p.toLowerCase()));
      if (tail.length >= 2) raw = `${tail[0]}${tail[1]}`;
      else if (tail.length === 1) raw = tail[0];
    }
  }
  const sym = raw ? normalizeSymbol(raw) : "";
  return { symbol: sym, timeframe };
}

const money = n => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 }).format(n);
const price = n => "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 8 });
const qtyFmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 6 });

function setStatus(text, error = false) {
  status.textContent = text;
  status.classList.toggle("error", error);
}

function showError(message) {
  setStatus(message, true);
  $("quantity").textContent = "—";
  $("unit").textContent = "";
  ["entry", "stop", "target", "risk-value", "reward", "notional"].forEach(id => { $(id).textContent = "—"; });
}

function render(d) {
  $("result-symbol").textContent = d.symbol;
  $("quantity").textContent = qtyFmt.format(d.quantity);
  $("unit").textContent = d.unit;
  $("entry").textContent = price(d.entry);
  $("stop").textContent = price(d.stop);
  $("target").textContent = price(d.target);
  $("risk-value").textContent = money(d.risk_at_size);
  $("reward").textContent = money(d.reward_at_target);
  $("notional").textContent = money(d.notional);
  setStatus("Updated " + new Date(d.priced_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
}

function scheduleCalc(delay = 250) {
  clearTimeout(calcTimer);
  calcTimer = setTimeout(calculate, delay);
}

async function calculate() {
  const seq = ++calcSeq;
  calcAbort?.abort();
  const rawInput = symbol.value.trim();
  let targetSymbol = rawInput;

  if (looksLikeLink(rawInput)) {
    const link = parseLink(rawInput);
    if (link?.symbol) {
      targetSymbol = link.symbol;
      if (link.timeframe && $("timeframe").value !== link.timeframe) {
        $("timeframe").value = link.timeframe;
      }
    }
  }

  const entryVal = customEntry.value.trim();
  const parsedEntry = entryVal ? Number(entryVal) : null;

  const payload = {
    symbol: normalizeSymbol(targetSymbol),
    direction,
    equity: Number($("equity").value),
    risk_pct: Number($("risk").value),
    rr: Number($("rr").value),
    timeframe: $("timeframe").value,
  };

  if (parsedEntry !== null) {
    if (!(parsedEntry > 0)) {
      showError("Entry price must be greater than 0.");
      return;
    }
    payload.entry_price = parsedEntry;
  }

  if (!payload.symbol) { showError("Enter a symbol or URL."); return; }
  if (!(payload.equity > 0)) { showError("Enter valid equity."); return; }
  if (!(payload.risk_pct > 0 && payload.risk_pct <= 100)) { showError("Risk must be between 0% and 100%."); return; }
  if (!(payload.rr > 0 && payload.rr <= 100)) { showError("Enter a valid target multiple."); return; }

  calcAbort = new AbortController();
  setStatus("Calculating…");
  try {
    const response = await fetch("/api/calc", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: calcAbort.signal,
    });
    const data = await response.json().catch(() => ({}));
    if (seq !== calcSeq) return;
    if (!response.ok) {
      showError(typeof data.detail === "string" ? data.detail : "Unable to calculate position.");
      return;
    }
    render(data);
  } catch (e) {
    if (e.name !== "AbortError" && seq === calcSeq) {
      showError("Market data unavailable.");
    }
  }
}

function closeSuggestions() {
  clearTimeout(searchTimer);
  searchAbort?.abort();
  suggestions.hidden = true;
  suggestions.replaceChildren();
  symbol.setAttribute("aria-expanded", "false");
  matches = [];
  active = -1;
}

function drawSuggestions(items) {
  matches = items;
  active = -1;
  suggestions.replaceChildren();
  if (!items.length) { closeSuggestions(); return; }
  for (let i = 0; i < items.length; i++) {
    const li = document.createElement("li");
    li.id = "symbol-option-" + i;
    li.role = "option";
    li.setAttribute("aria-selected", "false");
    li.dataset.index = i;
    const sym = document.createElement("span");
    sym.textContent = items[i].symbol;
    const name = document.createElement("span");
    name.className = "s-name";
    name.textContent = items[i].name || "";
    li.append(sym, name);
    suggestions.append(li);
  }
  suggestions.hidden = false;
  symbol.setAttribute("aria-expanded", "true");
}

async function searchSymbols(query, seq) {
  searchAbort?.abort();
  searchAbort = new AbortController();
  try {
    const response = await fetch("/api/search?q=" + encodeURIComponent(query), { signal: searchAbort.signal });
    if (!response.ok) throw Error("search failed");
    const items = await response.json();
    if (seq === searchSeq) drawSuggestions(items);
  } catch (e) {
    if (e.name !== "AbortError" && seq === searchSeq) closeSuggestions();
  }
}

function onSymbolInput() {
  clearTimeout(searchTimer);
  const seq = ++searchSeq;
  searchAbort?.abort();
  const val = symbol.value.trim();
  if (!val || looksLikeLink(val)) { closeSuggestions(); scheduleCalc(); return; }
  const query = val.toUpperCase();
  searchTimer = setTimeout(() => searchSymbols(query, seq), 100);
  scheduleCalc();
}

function choose(i) {
  if (!matches[i]) return;
  symbol.value = matches[i].symbol;
  customEntry.value = "";
  closeSuggestions();
  scheduleCalc(0);
}

function moveActive(step) {
  if (!matches.length) return;
  active = active < 0 ? (step > 0 ? 0 : matches.length - 1) : (active + step + matches.length) % matches.length;
  [...suggestions.children].forEach((el, i) => el.setAttribute("aria-selected", String(i === active)));
  symbol.setAttribute("aria-activedescendant", "symbol-option-" + active);
  suggestions.children[active].scrollIntoView({ block: "nearest" });
}

symbol.addEventListener("input", onSymbolInput);
symbol.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && !suggestions.hidden) { e.preventDefault(); moveActive(1); }
  else if (e.key === "ArrowUp" && !suggestions.hidden) { e.preventDefault(); moveActive(-1); }
  else if (e.key === "Escape") closeSuggestions();
  else if (e.key === "Enter") {
    e.preventDefault();
    if (!suggestions.hidden && active >= 0) choose(active);
    else { closeSuggestions(); scheduleCalc(0); }
  }
});
symbol.addEventListener("change", () => { closeSuggestions(); scheduleCalc(0); });
suggestions.addEventListener("pointerdown", e => {
  const li = e.target.closest("li[data-index]");
  if (li) { e.preventDefault(); choose(Number(li.dataset.index)); }
});
document.addEventListener("pointerdown", e => {
  if (!e.target.closest(".symbol-wrap")) closeSuggestions();
});

["custom-entry", "equity", "risk", "rr", "timeframe"].forEach(id => $(id).addEventListener("input", () => scheduleCalc()));
$("timeframe").addEventListener("change", () => scheduleCalc(0));

document.querySelectorAll("[data-side]").forEach(btn => btn.addEventListener("click", () => {
  direction = btn.dataset.side;
  $("direction").dataset.dir = direction;
  document.querySelectorAll("[data-side]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  scheduleCalc(0);
}));

setInterval(() => {
  const typing = document.activeElement && document.activeElement.matches("input,select");
  if (!document.hidden && !typing) calculate();
}, 20000);

calculate();
})();
</script>
</body>
</html>
