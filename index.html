<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>calc</title>
<style>
body{margin:16px;font:14px/1.35 Arial,sans-serif;background:#fff;color:#000}
.wrap{max-width:680px;display:flex;gap:32px;flex-wrap:wrap}
.col{flex:1;min-width:260px}
.row{margin-bottom:10px}
label{display:block;font-size:12px;margin-bottom:2px}
input,select,button{font:inherit;padding:4px 6px}
input,select{width:100%;box-sizing:border-box}
.two{display:flex;gap:8px}
.two>div{flex:1}
#qty{font-size:28px;font-weight:bold;font-family:monospace}
table{width:100%;border-collapse:collapse;margin-top:12px;font-family:monospace;font-size:13px}
td{padding:5px 2px;border-bottom:1px solid #ccc}
td:last-child{text-align:right}
#status{font-size:12px;color:#555;margin-left:8px}
</style>
</head>
<body>
<div><b>pos calc</b><span id="status"></span></div>
<hr>
<div class="wrap">
  <div class="col">
    <div class="row">
      <button type="button" id="longBtn">LONG</button>
      <button type="button" id="shortBtn">SHORT</button>
    </div>
    <div class="row"><label>symbol</label><input id="symbol" value="SPY"></div>
    <div class="row"><label>entry (blank = market)</label><input id="entryIn" type="number" step="any" placeholder="market"></div>
    <div class="row two">
      <div><label>account $</label><input id="equity" type="number" step="any" value="10000"></div>
      <div><label>risk %</label><input id="risk" type="number" step="any" value="1"></div>
    </div>
    <div class="row two">
      <div><label>target R</label><input id="rr" type="number" step="any" value="2"></div>
      <div><label>tf</label>
        <select id="tf">
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="4h">4h</option>
          <option value="1d" selected>1d</option>
          <option value="1w">1w</option>
        </select>
      </div>
    </div>
  </div>

  <div class="col">
    <div>qty (<span id="outSym">SPY</span>)</div>
    <div><span id="qty">-</span> <span id="unit"></span></div>
    <table>
      <tr><td>entry</td><td id="entry">-</td></tr>
      <tr><td>stop</td><td id="stop">-</td></tr>
      <tr><td>target</td><td id="target">-</td></tr>
      <tr><td>loss $</td><td id="loss">-</td></tr>
      <tr><td>gain $</td><td id="gain">-</td></tr>
      <tr><td>notional</td><td id="notional">-</td></tr>
    </table>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let dir="LONG", tmr, ctrl;

function setSide(s){
  dir=s;
  $("longBtn").style.fontWeight=s==="LONG"?"bold":"normal";
  $("shortBtn").style.fontWeight=s==="SHORT"?"bold":"normal";
  run();
}
$("longBtn").onclick=()=>setSide("LONG");
$("shortBtn").onclick=()=>setSide("SHORT");
setSide("LONG");

function err(m){
  $("status").textContent=m;
  ["qty","unit","entry","stop","target","loss","gain","notional"].forEach(i=>$(i).textContent="-");
}

async function run(){
  ctrl?.abort(); ctrl=new AbortController();
  const symbol=$("symbol").value.trim().toUpperCase();
  const equity=Number($("equity").value);
  const risk_pct=Number($("risk").value);
  const rr=Number($("rr").value);
  const rawE=$("entryIn").value.trim();
  const entry_price=rawE===""?null:Number(rawE);
  if(!symbol||!(equity>0)||!(risk_pct>0)||!(rr>0)||(entry_price!==null&&!(entry_price>0))) return err("bad input");
  $("status").textContent="...";
  try{
    const r=await fetch("/api/calc",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({symbol,direction:dir,equity,risk_pct,rr,timeframe:$("tf").value,entry_price}),
      signal:ctrl.signal
    });
    const d=await r.json();
    if(!r.ok) return err(d.detail||"err");
    $("outSym").textContent=d.symbol;
    $("qty").textContent=d.quantity;
    $("unit").textContent=d.unit;
    $("entry").textContent=d.entry;
    $("stop").textContent=d.stop+" ("+d.stop_pct+"%)";
    $("target").textContent=d.target;
    $("loss").textContent=d.risk_at_size;
    $("gain").textContent=d.reward_at_target;
    $("notional").textContent=d.notional;
    $("status").textContent=new Date(d.priced_at).toLocaleTimeString();
  }catch(e){if(e.name!=="AbortError")err("fail");}
}

const sched=()=>{clearTimeout(tmr);tmr=setTimeout(run,150);};
["symbol","entryIn","equity","risk","rr","tf"].forEach(i=>{$(i).oninput=sched;$(i).onchange=run;});
run();
</script>
</body>
</html>
